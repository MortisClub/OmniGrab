name: android-apk

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - name: sync version from tag
        env:
          VER: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('fs');const v=process.env.VER.replace(/^v/,'');const p=JSON.parse(fs.readFileSync('package.json'));p.version=v;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');const t=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json'));t.version=v;fs.writeFileSync('src-tauri/tauri.conf.json',JSON.stringify(t,null,2)+'\n');const c=fs.readFileSync('src-tauri/Cargo.toml','utf8').replace(/^version = \".*\"/m,'version = \"'+v+'\"');fs.writeFileSync('src-tauri/Cargo.toml',c)"

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install android sdk
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - run: npm install

      - name: init android target
        env:
          NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.3.11579264
        run: npx tauri android init --ci --skip-targets-install

      - name: build debug apk
        env:
          NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/26.3.11579264
          JAVA_HOME: ${{ env.JAVA_HOME }}
        run: npx tauri android build --debug --target aarch64

      - name: upload apk to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "found: $apk"
          cp "$apk" "OmniGrab-${{ github.ref_name }}-android.apk"
          gh release upload "${{ github.ref_name }}" "OmniGrab-${{ github.ref_name }}-android.apk" --clobber
